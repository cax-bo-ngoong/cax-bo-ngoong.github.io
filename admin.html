<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản trị bài viết - Công an xã Bờ Ngoong</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f6f4;
      color: #13251c;
      padding: 20px 16px;
    }
    .wrap { max-width: 820px; margin: 0 auto; }
    .card {
      background: #fff;
      border: 1px solid #dce6e0;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }
    h1, h2 { margin-top: 0; }
    .field { margin-bottom: 12px; }
    label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 5px; }
    input, select, textarea {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid #c7d4cc;
      border-radius: 8px;
      font: inherit;
    }
    textarea { min-height: 140px; resize: vertical; }
    .row-check { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .row-check input { width: auto; margin: 0; }
    button {
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid #c7d4cc;
      background: #fff;
      cursor: pointer;
      font-weight: 700;
    }
    .btn-primary { background: #0b6337; color: #fff; border-color: #0b6337; }
    .btn-danger { color: #b91c1c; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .post-item {
      border-bottom: 1px solid #e6ece8;
      padding: 12px 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    .post-item:last-child { border-bottom: 0; }
    .muted { color: #5a6d63; font-size: 12px; }
    .actions { display: flex; gap: 6px; flex-shrink: 0; }
    .hidden { display: none; }
    #msg { margin-bottom: 12px; font-weight: 700; color: #0b6337; }
    #msg.err { color: #b91c1c; }
    :root {
      --police: #145da0;
      --police-dark: #092f5b;
      --police-soft: #eaf2f9;
      --gold: #f5c451;
    }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 100% 0, rgba(20,93,160,.12), transparent 22rem),
        linear-gradient(180deg, #f7fafc, #edf4f8);
      color: #10253a;
    }
    .wrap { max-width: 920px; }
    .topbar {
      padding: 18px 20px;
      border-radius: 18px;
      background: linear-gradient(115deg, var(--police-dark), var(--police));
      color: #fff;
      box-shadow: 0 12px 30px rgba(9,47,91,.16);
    }
    .topbar h1 { margin: 0; font-size: 22px; letter-spacing: .3px; }
    .admin-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .admin-emblem,
    .admin-avatar {
      width: 58px;
      height: 58px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #fff;
      overflow: hidden;
      flex-shrink: 0;
    }
    .admin-emblem img,
    .admin-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .topbar a {
      color: #ffe49a;
      text-decoration: none;
      font-weight: 700;
    }
    .topbar button {
      color: #fff;
      background: rgba(255,255,255,.12);
      border-color: rgba(255,255,255,.35);
    }
    .card {
      border-color: #d6e2ec;
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(20,93,160,.08);
      padding: 22px;
    }
    h2 {
      color: var(--police-dark);
      font-size: 19px;
    }
    input, select, textarea {
      border-color: #c9d8e5;
      border-radius: 10px;
      background: #fbfdff;
    }
    input:focus, select:focus, textarea:focus {
      outline: 3px solid rgba(20,93,160,.12);
      border-color: var(--police);
    }
    button {
      border-radius: 10px;
      transition: transform .15s, box-shadow .15s;
    }
    button:hover { transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(90deg, var(--police-dark), var(--police));
      border: 0;
      box-shadow: 0 7px 16px rgba(20,93,160,.18);
    }
    .btn-danger { border-color: #efc5c5; background: #fff5f5; }
    .btn-toggle {
      min-width: 70px;
      color: var(--police-dark);
      background: #eef5fb;
      border-color: #bdd3e6;
    }
    .btn-toggle.hidden-post {
      color: #7a5a00;
      background: #fff8df;
      border-color: #eccd73;
    }
    .question-builder {
      border: 1px solid #d6e2ec;
      border-radius: 12px;
      background: #f8fbfd;
      padding: 12px;
    }
    .contest-question-block {
      border: 1px solid #d9e5ef;
      border-radius: 10px;
      background: #fff;
      padding: 12px;
      margin-bottom: 10px;
    }
    .contest-question-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .contest-answer-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
    }
    .contest-answer-row input[type="text"] {
      margin: 0;
    }
    .contest-answer-row input[type="radio"] {
      width: auto;
      margin: 0;
      cursor: pointer;
    }
    .add-answer-btn,
    .remove-answer-btn,
    .remove-question-btn,
    .add-question-btn {
      padding: 7px 10px;
      font-size: 12px;
    }
    .contest-question-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .post-item { border-bottom-color: #edf2f6; }
    .post-item strong { color: var(--police-dark); }
    #msg {
      padding: 10px 14px;
      border-radius: 10px;
      background: #eaf7ef;
    }
    #msg.err { background: #fff0f0; }
    @media (max-width: 640px) {
      body { padding: 12px 10px; }
      .topbar { padding: 15px; }
      .topbar h1 { font-size: 18px; }
      .admin-emblem,
      .admin-avatar { width: 48px; height: 48px; }
      .admin-brand { gap: 8px; }
      .post-item { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="admin-brand">
        <div class="admin-avatar">
          <img src="84e029e9-5834-48bd-9a77-b8a442ad11fd.jfif" alt="Công an xã Bờ Ngoong">
        </div>
        <h1>Quản trị bài viết — Bờ Ngoong</h1>
      </div>
      <div>
        <a href="index.html">← Về trang chủ</a>
        <button id="logout-btn" class="hidden" type="button" style="margin-left:10px;">Đăng xuất</button>
      </div>
    </div>

    <div id="msg"></div>

    <div id="login-box" class="card">
      <h2>Đăng nhập quản trị</h2>
      <form id="login-form">
        <div class="field">
          <label for="username">Tài khoản</label>
          <input id="username" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Mật khẩu</label>
          <input id="password" type="password" required autocomplete="current-password">
        </div>
        <button class="btn-primary" type="submit">Đăng nhập</button>
      </form>
    </div>

    <div id="panel-box" class="hidden">
      <div class="card">
        <h2 id="contest-form-heading">Tạo cuộc thi mới</h2>
        <form id="contest-form">
          <input id="contest-id" type="hidden">
          <div class="field">
            <label for="contest-title">Tên cuộc thi *</label>
            <input id="contest-title" maxlength="250" required>
          </div>
          <div class="field">
            <label for="contest-description">Mô tả</label>
            <textarea id="contest-description" style="min-height:100px"></textarea>
          </div>
          <div class="field">
            <label for="contest-organizer">Đơn vị tổ chức</label>
            <input id="contest-organizer" value="Công an xã Bờ Ngoong">
          </div>
          <div class="field">
            <label for="contest-link">Link tham gia (nếu có)</label>
            <input id="contest-link" type="url" placeholder="https://...">
          </div>
          <div class="field">
            <label>Câu hỏi trắc nghiệm (không cần link)</label>
            <div class="question-builder">
              <div id="contest-question-list"></div>
              <button id="add-question-btn" class="btn-primary add-question-btn" type="button">+ Thêm câu hỏi</button>
            </div>
            <textarea id="contest-questions" hidden></textarea>
            <div class="muted">Chọn một ô tròn để xác định đáp án đúng cho mỗi câu.</div>
          </div>
          <div class="field">
            <label for="contest-status">Trạng thái</label>
            <select id="contest-status">
              <option value="active">Đang diễn ra</option>
              <option value="ended">Đã kết thúc</option>
            </select>
          </div>
          <div class="field">
            <label for="contest-start">Ngày bắt đầu</label>
            <input id="contest-start" type="date">
          </div>
          <div class="field">
            <label for="contest-end">Ngày kết thúc</label>
            <input id="contest-end" type="date">
          </div>
          <label class="row-check">
            <input id="contest-published" type="checkbox" checked>
            Công khai cuộc thi
          </label>
          <button id="contest-save-btn" class="btn-primary" type="submit">Lưu cuộc thi</button>
          <button id="contest-cancel-btn" class="hidden" type="button">Hủy sửa</button>
        </form>
      </div>

      <div class="card">
        <h2>Danh sách cuộc thi</h2>
        <div id="admin-contests">Đang tải...</div>
      </div>

      <div class="card">
        <h2 id="form-heading">Đăng bài viết mới</h2>
        <form id="post-form">
          <div class="field">
            <label for="title">Tiêu đề *</label>
            <input id="title" maxlength="250" required>
          </div>
          <div class="field">
            <label for="category">Chuyên mục</label>
            <select id="category">
              <option value="Cảnh báo lừa đảo">Cảnh báo lừa đảo</option>
              <option value="Kỹ năng số & VNeID">Kỹ năng số &amp; VNeID</option>
              <option value="Tuyên truyền">Tuyên truyền</option>
            </select>
          </div>
          <div class="field">
            <label for="summary">Tóm tắt ngắn</label>
            <input id="summary" maxlength="300">
          </div>
          <div class="field">
            <label for="imageUrl">Link ảnh minh họa (https://...)</label>
            <input id="imageUrl" type="url" placeholder="https://...">
          </div>
          <div class="field">
            <label for="content">Nội dung bài viết *</label>
            <textarea id="content" required></textarea>
          </div>
          <label class="row-check">
            <input id="published" type="checkbox" checked>
            Xuất bản cho người dân xem
          </label>
          <button id="save-btn" class="btn-primary" type="submit">Lưu bài viết</button>
          <button id="cancel-btn" class="hidden" type="button">Hủy sửa</button>
        </form>
      </div>

      <div class="card">
        <h2>Danh sách bài viết</h2>
        <div id="admin-posts">Đang tải...</div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    (function () {
      var apiUrl = (window.APP_CONFIG && window.APP_CONFIG.apiUrl) || '';
      var token = sessionStorage.getItem('bongoong-post-token') || '';
      var editingId = '';

      var contestQuestionCounter = 0;

      function addContestAnswer(questionBlock, answerText, isCorrect) {
        var answerRows = questionBlock.querySelector('.contest-answer-list');
        var answerIndex = answerRows.querySelectorAll('.contest-answer-row').length;
        var questionIndex = questionBlock.getAttribute('data-question-index');
        var row = document.createElement('div');
        row.className = 'contest-answer-row';
        row.innerHTML =
          '<input type="radio" name="correct-' + questionIndex + '" ' + (isCorrect ? 'checked' : '') + '>' +
          '<input type="text" class="contest-answer-text" maxlength="300" placeholder="Nội dung đáp án ' + (answerIndex + 1) + '" value="' +
          escapeHtml(answerText || '') + '">' +
          '<button type="button" class="remove-answer-btn btn-danger">Xóa</button>';
        var removeButton = row.querySelector('.remove-answer-btn');
        removeButton.addEventListener('click', function () {
          var rows = answerRows.querySelectorAll('.contest-answer-row');
          if (rows.length <= 2) {
            showMsg('Mỗi câu cần ít nhất 2 đáp án.', true);
            return;
          }
          row.remove();
          renumberContestAnswers(questionBlock);
        });
        answerRows.appendChild(row);
      }

      function renumberContestAnswers(questionBlock) {
        var rows = questionBlock.querySelectorAll('.contest-answer-row');
        rows.forEach(function (row, index) {
          var input = row.querySelector('.contest-answer-text');
          if (!input.value) input.placeholder = 'Nội dung đáp án ' + (index + 1);
          var radio = row.querySelector('input[type="radio"]');
          radio.value = String(index);
        });
      }

      function addContestQuestion(questionData) {
        contestQuestionCounter++;
        var questionIndex = contestQuestionCounter;
        var block = document.createElement('div');
        block.className = 'contest-question-block';
        block.setAttribute('data-question-index', String(questionIndex));
        block.innerHTML =
          '<div class="contest-question-head">' +
          '<strong>Câu ' + questionIndex + '</strong>' +
          '<button type="button" class="remove-question-btn btn-danger">Xóa câu</button>' +
          '</div>' +
          '<div class="field" style="margin-bottom:8px">' +
          '<input type="text" class="contest-question-text" maxlength="500" placeholder="Nhập nội dung câu hỏi">' +
          '</div>' +
          '<div class="contest-answer-list"></div>' +
          '<div class="contest-question-actions">' +
          '<button type="button" class="add-answer-btn">+ Thêm đáp án</button>' +
          '</div>';

        block.querySelector('.contest-question-text').value = questionData && questionData.q ? questionData.q : '';
        block.querySelector('.remove-question-btn').addEventListener('click', function () {
          var blocks = document.querySelectorAll('.contest-question-block');
          if (blocks.length <= 1) {
            showMsg('Cuộc thi cần ít nhất 1 câu hỏi.', true);
            return;
          }
          block.remove();
          renumberContestQuestions();
        });
        block.querySelector('.add-answer-btn').addEventListener('click', function () {
          addContestAnswer(block, '', false);
        });
        document.getElementById('contest-question-list').appendChild(block);

        var answers = questionData && Array.isArray(questionData.options)
          ? questionData.options
          : ['', ''];
        var correctIndex = questionData && Number.isInteger(Number(questionData.answer))
          ? Number(questionData.answer)
          : 0;
        answers.forEach(function (answer, index) {
          addContestAnswer(block, answer, index === correctIndex);
        });
        renumberContestQuestions();
      }

      function renumberContestQuestions() {
        var blocks = document.querySelectorAll('.contest-question-block');
        blocks.forEach(function (block, index) {
          block.querySelector('.contest-question-head strong').textContent = 'Câu ' + (index + 1);
          block.setAttribute('data-question-index', String(index + 1));
          var radios = block.querySelectorAll('input[type="radio"]');
          radios.forEach(function (radio) {
            radio.name = 'correct-' + (index + 1);
          });
        });
        contestQuestionCounter = blocks.length;
      }

      function getContestQuestions() {
        var questions = [];
        var blocks = document.querySelectorAll('.contest-question-block');
        for (var i = 0; i < blocks.length; i++) {
          var block = blocks[i];
          var q = block.querySelector('.contest-question-text').value.trim();
          var answerInputs = block.querySelectorAll('.contest-answer-text');
          var radios = block.querySelectorAll('input[type="radio"]');
          var options = [];
          var answer = -1;
          for (var j = 0; j < answerInputs.length; j++) {
            var text = answerInputs[j].value.trim();
            if (!text) {
              showMsg('Vui lòng nhập đầy đủ nội dung đáp án ở Câu ' + (i + 1) + '.', true);
              answerInputs[j].focus();
              return null;
            }
            options.push(text);
            if (radios[j].checked) answer = j;
          }
          if (!q) {
            showMsg('Vui lòng nhập nội dung Câu ' + (i + 1) + '.', true);
            block.querySelector('.contest-question-text').focus();
            return null;
          }
          if (answer < 0) {
            showMsg('Hãy chọn đáp án đúng cho Câu ' + (i + 1) + '.', true);
            return null;
          }
          questions.push({ q: q, options: options, answer: answer });
        }
        return questions;
      }

      function parseContestQuestions(value) {
        if (!value) return [];
        if (Array.isArray(value)) return value;
        try {
          var parsed = JSON.parse(value);
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          return [];
        }
      }

      function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text || '';
        return div.innerHTML;
      }

      function resetContestForm() {
        document.getElementById('contest-form').reset();
        document.getElementById('contest-id').value = '';
        document.getElementById('contest-organizer').value = 'Công an xã Bờ Ngoong';
        document.getElementById('contest-published').checked = true;
        document.getElementById('contest-status').value = 'active';
        document.getElementById('contest-form-heading').textContent = 'Tạo cuộc thi mới';
        document.getElementById('contest-save-btn').textContent = 'Lưu cuộc thi';
        document.getElementById('contest-cancel-btn').classList.add('hidden');
        document.getElementById('contest-question-list').innerHTML = '';
        contestQuestionCounter = 0;
        addContestQuestion();
      }

      function startContestEdit(contest) {
        document.getElementById('contest-id').value = contest.id;
        document.getElementById('contest-title').value = contest.title || '';
        document.getElementById('contest-description').value = contest.description || '';
        document.getElementById('contest-organizer').value = contest.organizer || 'Công an xã Bờ Ngoong';
        document.getElementById('contest-link').value = contest.link || '';
        document.getElementById('contest-question-list').innerHTML = '';
        contestQuestionCounter = 0;
        var questions = parseContestQuestions(contest.questions);
        if (!questions.length) questions = [{ q: '', options: ['', ''], answer: 0 }];
        questions.forEach(function (question) {
          addContestQuestion(question);
        });
        document.getElementById('contest-status').value = contest.status || 'active';
        document.getElementById('contest-start').value = contest.startDate || '';
        document.getElementById('contest-end').value = contest.endDate || '';
        document.getElementById('contest-published').checked = Boolean(contest.published);
        document.getElementById('contest-form-heading').textContent = 'Đang sửa cuộc thi: ' + (contest.title || '');
        document.getElementById('contest-save-btn').textContent = 'Cập nhật cuộc thi';
        document.getElementById('contest-cancel-btn').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function loadAdminContests() {
        callApi({ action: 'getAllContests', token: token }).then(function (data) {
          var box = document.getElementById('admin-contests');
          box.innerHTML = '';
          if (!data || !data.success) {
            box.innerHTML = '<p class="muted">' + ((data && data.message) || 'Chưa thể tải danh sách cuộc thi.') + '</p>';
            return;
          }
          if (!data.contests || !data.contests.length) {
            box.innerHTML = '<p class="muted">Chưa có cuộc thi nào.</p>';
            return;
          }
          data.contests.forEach(function (contest) {
            var item = document.createElement('div');
            item.className = 'post-item';
            var info = document.createElement('div');
            var title = document.createElement('strong');
            title.textContent = contest.title;
            var meta = document.createElement('div');
            meta.className = 'muted';
            var statusText = contest.status === 'ended' ? 'Đã kết thúc' : 'Đang diễn ra';
            meta.textContent = statusText + ' · ' + (contest.published ? 'Đang công khai' : 'Đang ẩn');
            info.appendChild(title);
            info.appendChild(meta);

            var actions = document.createElement('div');
            actions.className = 'actions';
            var editBtn = document.createElement('button');
            editBtn.type = 'button';
            editBtn.textContent = 'Sửa';
            editBtn.addEventListener('click', function () { startContestEdit(contest); });
            var deleteBtn = document.createElement('button');
            deleteBtn.type = 'button';
            deleteBtn.className = 'btn-danger';
            deleteBtn.textContent = 'Xóa';
            deleteBtn.addEventListener('click', function () {
              if (!confirm('Xóa cuộc thi "' + contest.title + '"?')) return;
              callApi({ action: 'deleteContest', token: token, id: contest.id }).then(function (res) {
                if (!res || !res.success) return showMsg((res && res.message) || 'Xóa cuộc thi thất bại.', true);
                showMsg('Đã xóa cuộc thi.');
                loadAdminContests();
              });
            });
            actions.appendChild(editBtn);
            actions.appendChild(deleteBtn);
            item.appendChild(info);
            item.appendChild(actions);
            box.appendChild(item);
          });
        });
      }

      function showMsg(text, isErr) {
        var el = document.getElementById('msg');
        el.textContent = text || '';
        el.className = isErr ? 'err' : '';
      }

      function callApi(payload) {
        return fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        }).then(function (r) { return r.json(); });
      }

      function setLoggedIn(loggedIn) {
        document.getElementById('login-box').classList.toggle('hidden', loggedIn);
        document.getElementById('panel-box').classList.toggle('hidden', !loggedIn);
        document.getElementById('logout-btn').classList.toggle('hidden', !loggedIn);
      }

      function resetForm() {
        editingId = '';
        document.getElementById('post-form').reset();
        document.getElementById('published').checked = true;
        document.getElementById('form-heading').textContent = 'Đăng bài viết mới';
        document.getElementById('save-btn').textContent = 'Lưu bài viết';
        document.getElementById('cancel-btn').classList.add('hidden');
      }

      function startEdit(post) {
        editingId = post.id;
        document.getElementById('title').value = post.title;
        document.getElementById('category').value = post.category || 'Tuyên truyền';
        document.getElementById('summary').value = post.summary || '';
        document.getElementById('imageUrl').value = post.imageUrl || '';
        document.getElementById('content').value = post.content;
        document.getElementById('published').checked = Boolean(post.published);
        document.getElementById('form-heading').textContent = 'Đang sửa: ' + post.title;
        document.getElementById('save-btn').textContent = 'Cập nhật bài viết';
        document.getElementById('cancel-btn').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function loadAdminPosts() {
        callApi({ action: 'getAllPosts', token: token }).then(function (data) {
          if (!data || !data.success) {
            showMsg((data && data.message) || 'Phiên hết hạn, hãy đăng nhập lại.', true);
            token = '';
            sessionStorage.removeItem('bongoong-post-token');
            setLoggedIn(false);
            return;
          }
          var box = document.getElementById('admin-posts');
          box.innerHTML = '';
          var fallbackPosts = [
            { id:'POST001', title:'Nhận diện cuộc gọi giả danh Công an', category:'Cảnh báo lừa đảo', summary:'Các đối tượng thường mượn danh Công an, Công tố viên để tạo áp lực, ép người dân làm theo ngay.', content:'KỊCH BẢN LỪA ĐẢO GIẢ DANH CƠ QUAN NHÀ NƯỚC\n\nCác đối tượng thường tự xưng là cán bộ điều tra, Công an, Viện kiểm sát hoặc nhân viên Ngân hàng. Họ yêu cầu truy cập link lạ, cài ứng dụng điều khiển điện thoại, chuyển tiền hoặc cung cấp OTP.\n\nCƠ QUAN CHỨC NĂNG KHÔNG LÀM NHƯ VẬY\n\nCơ quan Nhà nước không yêu cầu nộp tiền, chuyển tiền vào tài khoản cá nhân hoặc cung cấp mã OTP qua điện thoại.\n\nKHI NHẬN CUỘC GỌI NGHI NGỜ\n\nKết thúc cuộc gọi, không truy cập link hoặc cài phần mềm. Xác minh qua số chính thức và lưu bằng chứng nếu đã bị thiệt hại.', published:true },
            { id:'POST002', title:'Bảo vệ tài khoản Ngân hàng khi nhận tin nhắn lạ', category:'Cảnh báo lừa đảo', summary:'Mã OTP, mật khẩu và ứng dụng ngân hàng là tài sản số cần được bảo vệ.', content:'DẤU HIỆU CẦN CẢNH GIÁC\n\nNgười lạ có thể tự xưng nhân viên Ngân hàng, tổng đài hỗ trợ hoặc nhân viên bưu điện. Họ báo tài khoản bị khóa, có giao dịch bất thường hoặc cần xác minh khuôn mặt.\n\nKHÔNG CUNG CẤP OTP\n\nOTP là mật khẩu xác nhận giao dịch một lần. Nhân viên Ngân hàng không hỏi mã OTP, mã PIN hoặc mật khẩu ứng dụng.\n\nCÁCH BẢO VỆ\n\nChỉ liên hệ qua số ghi trên thẻ hoặc ứng dụng chính thức. Bật xác thực hai bước và khóa thẻ khi phát hiện giao dịch lạ.', published:true },
            { id:'POST003', title:'VNeID an toàn cho người dân', category:'Kỹ năng số & VNeID', summary:'Bảo vệ tài khoản, mã QR và thông tin cá nhân khi sử dụng VNeID.', content:'VNeID HỖ TRỢ ĐỊNH DANH ĐIỆN TỬ\n\nVNeID giúp cài đặt giấy tờ điện tử, tra cứu thủ tục hành chính và sử dụng tiện ích công trực tuyến.\n\nCÁCH SỬ DỤNG AN TOÀN\n\nChỉ tải ứng dụng từ kho chính thức, không cài file gửi qua Zalo hoặc tin nhắn. Không chia sẻ mã OTP, mật khẩu, ảnh màn hình tài khoản hoặc mã QR cho người lạ.\n\nKHI GẶP SỰ CỐ\n\nNếu quên mật khẩu, mất điện thoại hoặc nghi ngờ tài khoản bị truy cập, đến điểm hỗ trợ VNeID hoặc cơ quan Công an địa phương để được hướng dẫn.', published:true },
            { id:'POST004', title:'Tránh mã QR giả và đường link lạ', category:'Cảnh báo lừa đảo', summary:'Mã QR và đường link lạ có thể dẫn đến trang giả mạo để chiếm tài khoản.', content:'DẤU HIỆU NGHI NGỜ\n\nĐối tượng gửi mã QR hoặc link để nhận thưởng, hoàn tiền, xác minh tài khoản, tra cứu phạt nguội hoặc hỗ trợ VNeID.\n\nKIỂM TRA TRƯỚC KHI QUÉT\n\nKiểm tra mã QR, tên người thụ hưởng và nội dung chuyển tiền. Không quét mã dán đè trên biển QR cũ.\n\nKHI ĐÃ BẤM NHẦM LINK\n\nKhông nhập mật khẩu. Đóng trình duyệt, đổi mật khẩu, kiểm tra thiết bị đăng nhập và liên hệ Ngân hàng nếu đã chuyển tiền.', published:true },
            { id:'POST005', title:'Không tải file APK ngoài kho ứng dụng', category:'Kỹ năng số & VNeID', summary:'File APK không rõ nguồn có thể chiếm quyền điện thoại và tài khoản.', content:'NGUY CƠ TỪ FILE .APK\n\nKẻ gian gửi file giả danh Ngân hàng, Công an, VNeID hoặc phần mềm nộp phạt để đọc tin nhắn, ghi màn hình hoặc điều khiển điện thoại.\n\nKHÔNG CÀI TỪ NGƯỜI LẠ\n\nChỉ tải ứng dụng từ Google Play, App Store hoặc website chính thức.\n\nKHI ĐÃ CÀI NHẦM\n\nTắt mạng, gỡ ứng dụng, quét mã độc và đổi mật khẩu Zalo, Facebook, email, Ngân hàng.', published:true },
            { id:'POST006', title:'Cảnh giác mua hàng, đặt cọc trực tuyến', category:'Cảnh báo lừa đảo', summary:'Kiểm tra người bán, sàn thương mại và hình thức thanh toán trước khi đặt cọc.', content:'DẤU HIỆU NÊN TRÁNH\n\nHàng hóa rẻ bất thường, khuyến mãi lớn, đánh giá giả hoặc trang mạng xã hội mới tạo là dấu hiệu cần thận trọng.\n\nKIỂM TRA NGƯỜI BÁN\n\nƯu tiên sàn thương mại, cửa hàng có địa chỉ, số điện thoại và chính sách đổi trả rõ ràng.\n\nGIỮ BẰNG CHỨNG\n\nLưu tin nhắn, hóa đơn, thời gian giao dịch, số tài khoản và link người bán. Không chuyển cọc toàn bộ nếu chưa xác minh.', published:true },
            { id:'POST007', title:'Bảo vệ thông tin CCCD và giấy tờ cá nhân', category:'Tuyên truyền', summary:'CCCD có thể bị lợi dụng để mở tài khoản, vay tiền hoặc giả danh.', content:'CCCD LÀ THÔNG TIN NHẠY CẢM\n\nẢnh CCCD, sổ hộ khẩu, bằng lái xe hoặc giấy khai sinh có thể bị dùng để vay tiền, đăng ký SIM, mở ví điện tử hoặc giả danh.\n\nKHI NÀO NÊN CUNG CẤP\n\nChỉ cung cấp thông tin cho cơ quan, tổ chức có thẩm quyền qua thủ tục trực tiếp hoặc cổng chính thống.\n\nBẢO VỆ HÀNG NGÀY\n\nKhông công khai CCCD trên mạng xã hội, không ký xác nhận hồ sơ chưa đọc kỹ và liên hệ cơ quan chức năng khi phát hiện thông tin bị lợi dụng.', published:true },
            { id:'POST008', title:'Xử lý khi nghi ngờ bị lừa đảo', category:'Tuyên truyền', summary:'Hành động nhanh và lưu bằng chứng để ngăn thiệt hại lan rộng.', content:'DỪNG GIAO DỊCH NGAY\n\nNếu vừa chuyển tiền, không tiếp tục làm theo yêu cầu của đối tượng. Liên hệ Ngân hàng qua số chính thức để khóa thẻ và tài khoản.\n\nGIỮ BẰNG CHỨNG\n\nChụp cuộc gọi, tin nhắn, số tài khoản, mã giao dịch, hóa đơn và trang web đối tượng.\n\nBÁO CƠ QUAN CÓ THẨM QUYỀN\n\nLiên hệ Công an xã Bờ Ngoong để được hướng dẫn. Cảnh báo người thân để họ không mắc kịch bản tương tự.', published:true },
            { id:'POST009', title:'An toàn trên mạng xã hội', category:'Kỹ năng số & VNeID', summary:'Bảo vệ tài khoản khỏi chiếm đoạt và nguy cơ giả danh người thân.', content:'TÀI KHOẢN DỄ BỊ CHIẾM ĐOẠT\n\nKẻ gian có thể nhắn tin mượn tiền, bán hàng giả hoặc giả danh người thân.\n\nBIỆN PHÁP BẢO VỆ\n\nDùng mật khẩu mạnh, bật xác thực hai bước và không chia sẻ OTP.\n\nKHI NHẬN TIN NGHI NGỜ\n\nGọi trực tiếp người thân qua số đã lưu thay vì chỉ nhắn lại trên tài khoản. Khi tài khoản bị chiếm, báo nhà cung cấp, cảnh báo bạn bè và đổi mật khẩu email.', published:true },
            { id:'POST010', title:'Công dân số Bờ Ngoong: 5 thói quen an toàn', category:'Tuyên truyền', summary:'Kiến thức cơ bản giúp người dân sử dụng dịch vụ số an toàn và chủ động.', content:'THÓI QUEN XÁC MINH\n\nKhông tin tin nhắn hoặc cuộc gọi chỉ vì người gửi biết thông tin cá nhân. Kiểm tra tên miền, số điện thoại và địa chỉ cơ quan.\n\nTHÓI QUEN BẢO VỆ\n\nKhông chia sẻ OTP, mật khẩu hoặc cho người lạ điều khiển điện thoại. Bật xác thực hai bước cho Zalo, Facebook, email, Ngân hàng và VNeID.\n\nTHÓI QUEN GIAO DỊCH AN TOÀN\n\nƯu tiên sàn thương mại, website chính thống và địa điểm hỗ trợ công. Không chuyển tiền cọc cho tài khoản cá nhân chưa xác minh.\n\nTHÓI QUEN LAN TỎA\n\nCảnh báo người thân và chia sẻ kinh nghiệm phòng tránh. Liên hệ Công an xã Bờ Ngoong khi nghi ngờ bị lừa.', published:true }
          ];
          var posts = data.posts && data.posts.length ? data.posts : fallbackPosts;
          posts.forEach(function (post) {
            var item = document.createElement('div');
            item.className = 'post-item';

            var info = document.createElement('div');
            var strong = document.createElement('strong');
            strong.textContent = post.title;
            var meta = document.createElement('div');
            meta.className = 'muted';
            meta.textContent = (post.category || 'Tuyên truyền') + ' · ' + (post.published ? 'Đang hiển thị' : 'Đang ẩn');
            info.appendChild(strong);
            info.appendChild(meta);

            var actions = document.createElement('div');
            actions.className = 'actions';
            var editBtn = document.createElement('button');
            editBtn.type = 'button';
            editBtn.textContent = 'Sửa';
            editBtn.addEventListener('click', function () { startEdit(post); });

            var toggleBtn = document.createElement('button');
            toggleBtn.type = 'button';
            toggleBtn.className = 'btn-toggle' + (post.published ? '' : ' hidden-post');
            toggleBtn.textContent = post.published ? 'Ẩn bài' : 'Hiện bài';
            toggleBtn.addEventListener('click', function () {
              var nextPublished = !post.published;
              callApi({
                action: 'setPostPublished',
                token: token,
                id: post.id,
                published: nextPublished
              }).then(function (res) {
                if (!res || !res.success) {
                  if (/^POST\d{3}$/.test(post.id)) {
                    var overrides = {};
                    try {
                      overrides = JSON.parse(localStorage.getItem('bongoong-post-visibility') || '{}');
                    } catch (error) {}
                    overrides[post.id] = nextPublished;
                    localStorage.setItem('bongoong-post-visibility', JSON.stringify(overrides));
                    post.published = nextPublished;
                    showMsg(nextPublished ? 'Đã hiển thị bài viết.' : 'Đã ẩn bài viết.');
                    loadAdminPosts();
                    return;
                  }
                  showMsg((res && res.message) || 'Không đổi được trạng thái bài viết.', true);
                  return;
                }
                post.published = nextPublished;
                showMsg(nextPublished ? 'Đã hiển thị bài viết.' : 'Đã ẩn bài viết.');
                loadAdminPosts();
              });
            });

            var delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'btn-danger';
            delBtn.textContent = 'Xóa';
            delBtn.addEventListener('click', function () {
              if (!confirm('Xóa bài viết "' + post.title + '"?')) return;
              callApi({ action: 'deletePost', token: token, id: post.id }).then(function (res) {
                if (!res || !res.success) return showMsg(res.message || 'Xóa thất bại.', true);
                if (editingId === post.id) resetForm();
                showMsg('Đã xóa bài viết.');
                loadAdminPosts();
              });
            });

            actions.appendChild(toggleBtn);
            actions.appendChild(editBtn);
            actions.appendChild(delBtn);
            item.appendChild(info);
            item.appendChild(actions);
            box.appendChild(item);
          });
        });
      }

      document.getElementById('login-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var u = document.getElementById('username').value;
        var p = document.getElementById('password').value;
        callApi({ action: 'adminLogin', username: u, password: p }).then(function (res) {
          if (!res || !res.success) {
            showMsg((res && res.message) || 'Đăng nhập thất bại.', true);
            return;
          }
          token = res.token;
          sessionStorage.setItem('bongoong-post-token', token);
          document.getElementById('password').value = '';
          showMsg('Đăng nhập thành công.');
          setLoggedIn(true);
          loadAdminPosts();
          loadAdminContests();
        }).catch(function () {
          showMsg('Lỗi kết nối tới máy chủ.', true);
        });
      });

      document.getElementById('logout-btn').addEventListener('click', function () {
        callApi({ action: 'adminLogout', token: token }).finally(function () {
          token = '';
          sessionStorage.removeItem('bongoong-post-token');
          setLoggedIn(false);
          showMsg('Đã đăng xuất.');
        });
      });

      document.getElementById('cancel-btn').addEventListener('click', resetForm);

      document.getElementById('contest-cancel-btn').addEventListener('click', resetContestForm);

      document.getElementById('add-question-btn').addEventListener('click', function () {
        addContestQuestion();
      });

      document.getElementById('contest-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var questions = getContestQuestions();
        if (questions === null) return;
        var questionsText = JSON.stringify(questions);
        var contestPayload = {
          title: document.getElementById('contest-title').value,
          description: document.getElementById('contest-description').value,
          organizer: document.getElementById('contest-organizer').value,
          link: document.getElementById('contest-link').value,
          questions: questionsText,
          status: document.getElementById('contest-status').value,
          startDate: document.getElementById('contest-start').value,
          endDate: document.getElementById('contest-end').value,
          published: document.getElementById('contest-published').checked
        };
        var id = document.getElementById('contest-id').value;
        var request = id
          ? callApi({ action: 'updateContest', token: token, id: id, contest: contestPayload })
          : callApi({ action: 'saveContest', token: token, contest: contestPayload });
        request.then(function (res) {
          if (!res || !res.success) {
            showMsg((res && res.message) || 'Không lưu được cuộc thi.', true);
            return;
          }
          resetContestForm();
          showMsg('Đã lưu cuộc thi thành công.');
          loadAdminContests();
        }).catch(function () {
          showMsg('Lỗi khi lưu cuộc thi.', true);
        });
      });

      document.getElementById('post-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var postPayload = {
          title: document.getElementById('title').value,
          category: document.getElementById('category').value,
          summary: document.getElementById('summary').value,
          imageUrl: document.getElementById('imageUrl').value,
          content: document.getElementById('content').value,
          published: document.getElementById('published').checked
        };
        var req = editingId
          ? callApi({ action: 'updatePost', token: token, id: editingId, post: postPayload })
          : callApi({ action: 'savePost', token: token, post: postPayload });

        req.then(function (res) {
          if (!res || !res.success) {
            showMsg((res && res.message) || 'Không lưu được bài viết.', true);
            return;
          }
          resetForm();
          showMsg('Đã lưu bài viết thành công.');
          loadAdminPosts();
        }).catch(function () {
          showMsg('Lỗi khi lưu bài viết.', true);
        });
      });

      if (token) {
        setLoggedIn(true);
        loadAdminPosts();
        loadAdminContests();
      } else {
        setLoggedIn(false);
      }
      resetContestForm();
    })();
  </script>
</body>
</html>
